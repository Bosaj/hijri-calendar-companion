name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Refuses a tampered gradle-wrapper.jar before anything runs it.
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Repository Checks
        run: python3 -m unittest discover -s tests -v

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      # Each step fails the job on error: no "|| true".
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Unsigned here (no keystore in CI); proves R8 and resource shrinking still build.
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: hijri-companion-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
